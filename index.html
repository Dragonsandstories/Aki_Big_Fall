<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aki's Big Fall</title>
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --ink: #2b2b2b; --soft: #5d5d5d; --paper: #fffdf6; --yellow: #ffd23f; --green: #2f8a35; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper);
         color: var(--ink); font: 21px/1.5 'Patrick Hand', system-ui, sans-serif; text-align: center; }
  main { padding: 2rem 1.2rem 3rem; }
  img { width: 168px; height: 168px; border: 3px solid var(--ink); border-radius: 34px 28px 36px 26px;
        box-shadow: 5px 6px 0 var(--yellow); background: #fff; }
  h1 { font-family: 'Cabin Sketch', system-ui, sans-serif; font-size: 2.7rem; line-height: 1.1; margin: 1.1rem 0 .4rem; }
  p { margin: .4rem 0; }
  a { color: var(--green); }
  .small { color: var(--soft); font-size: 1.05rem; margin-top: 1.8rem; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="Aki the dinosaur">
  <h1>Aki's Big Fall</h1>
  <p>Help Aki the dinosaur on his wild trip down.</p>
  <p class="small">A game by Dragons and Stories. <a href="privacy.html">Privacy policy</a></p>
</main>
<script>
  // The old web version left an offline copy in some browsers. This removes it.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (list) {
      list.forEach(function (reg) { reg.unregister(); });
    }).catch(function () {});
  }
</script>
</body>
</html>
